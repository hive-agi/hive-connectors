name: image

# Build the digest CLI image and push it to GHCR on every change that reaches
# main. The k8s-agi hive-digest context pins one of these tags; bumping the pin
# is what deploys it.
#
# Tags: the short commit (immutable, what the cluster pins) and `main`.
# The package is created private on first push; make it public once in the
# package settings, or the cluster needs a pull secret.
on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'resources/**'
      - 'deps.edn'
      - 'Dockerfile'
      - '.github/workflows/image.yml'
  workflow_dispatch:

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Tags
        id: tags
        run: echo "sha=$(git rev-parse --short=7 HEAD)" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: SOURCE_REF=${{ github.sha }}
          tags: |
            ghcr.io/hive-agi/hive-connectors:${{ steps.tags.outputs.sha }}
            ghcr.io/hive-agi/hive-connectors:main
